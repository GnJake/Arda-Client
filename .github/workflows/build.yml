name: Build
on: push

# Checks that every push builds. Releases are made by hand, so nothing is published from here.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Jar
        uses: actions/upload-artifact@v7
        with:
          name: Arda Client
          path: build/libs/
